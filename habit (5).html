:root{color-scheme:dark;--bg:#090d12;--fg:#f1f4f8;--muted:#8792a4;--line:#222a34;--empty:#1b232d;--blue:#59a8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}[hidden]{display:none!important}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.22;cursor:default}.app{max-width:540px;margin:auto;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 25px) 17px calc(env(safe-area-inset-bottom) + 90px)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:29px}header h1{font-size:25px;font-weight:650;letter-spacing:-.9px;margin:0}.iconbtn{border:0;background:transparent;color:#e8edf4;padding:10px;font-size:24px;line-height:1}.topright{display:flex;align-items:center;gap:2px;position:relative}.section{display:none}.section.active{display:block}.period{display:flex;align-items:center;justify-content:space-between;margin:0 0 19px}.period strong{font-size:14px;font-weight:600;letter-spacing:.8px;color:#b7c2d2;text-transform:uppercase}.nav{display:flex;gap:4px}.nav button{border:0;background:#141b24;color:#e8edf4;border-radius:10px;padding:8px 13px;font-size:19px}.gridwrap{width:100%;overflow-x:auto;scrollbar-width:none}.gridwrap::-webkit-scrollbar{display:none}.habitgrid{display:grid;grid-template-columns:minmax(118px,1.65fr) repeat(7,minmax(30px,1fr));width:100%;border-top:1px solid var(--line)}.gridhead{height:61px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--muted);font-size:11px;border-bottom:1px solid var(--line);gap:5px}.gridhead:first-child{align-items:flex-start}.gridhead b{color:var(--fg);font-size:14px;font-weight:550}.habitlabel{min-height:57px;display:flex;align-items:center;padding:5px 7px 5px 0;font-size:12px;font-weight:600;line-height:1.3;word-break:break-word;border-bottom:1px solid var(--line);cursor:pointer}.cell{height:57px;width:100%;border:0;border-right:1px solid #10151c;border-bottom:1px solid #10151c;background:var(--empty);border-radius:0;transition:background .12s}.cell.done{background:var(--habit)}.cell.future{background:#111820;cursor:not-allowed}.cell.locked{cursor:not-allowed;opacity:1}.cell:focus-visible,.habitlabel:focus-visible{outline:2px solid white;outline-offset:-2px}.empty{text-align:center;color:var(--muted);padding:55px 12px;line-height:1.5;font-size:14px}.addbtn{margin-top:25px;border:1px solid #303b49;border-radius:12px;background:#141b24;color:#e6edf6;padding:12px 17px;width:100%;font-weight:550}.segment{display:flex;background:#141c26;border-radius:12px;padding:4px;margin:0 0 50px}.segment button{width:50%;background:none;color:#9aa8ba;border:0;border-radius:9px;padding:12px}.segment button.active{background:#2b394c;color:#fff}.chart{height:280px;display:flex;align-items:stretch;gap:5px;margin-top:35px}.barcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px}.barval{font-size:10px;color:#c7d1df;white-space:nowrap}.track{width:100%;height:220px;background:#1b2531;border-radius:5px;display:flex;align-items:flex-end;overflow:hidden}.fill{width:100%;background:linear-gradient(180deg,#60aaff,#3e82ef);border-radius:4px 4px 0 0}.barlabel{font-size:10px;color:var(--muted);height:15px}.monthchart{gap:2px}.monthchart .track{height:240px;border-radius:2px}.monthchart .fill{border-radius:2px 2px 0 0}.monthchart .barlabel{font-size:9px}.monthchart .barval{display:none}.charttitle{display:flex;align-items:center;justify-content:space-between;margin-top:2px;color:var(--muted);font-size:13px}.charttitle strong{color:#f1f4f8;font-size:15px}.footnote{color:#778395;font-size:12px;line-height:1.5;margin-top:23px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#0b1017ee;backdrop-filter:blur(16px);border-top:1px solid #222c38;padding:12px 0 calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:85px;z-index:5}.tabs button{border:0;background:none;color:#8290a4;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;min-width:65px}.tabs button.active{color:var(--blue)}.tabs svg{width:23px;height:23px}.modalback{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:center;justify-content:center;padding:20px}.modalback.open{display:flex}.modal{width:min(100%,400px);background:#151d27;border:1px solid #2a3645;border-radius:18px;padding:22px}.modal h2{font-size:19px;margin:0 0 18px}.modal label{font-size:12px;color:#aab5c4;display:block;margin:14px 0 7px}.modal input[type=text]{width:100%;border:1px solid #344154;border-radius:10px;padding:12px;background:#0d141c;color:#fff;outline:none}.palette{display:flex;flex-wrap:wrap;gap:10px}.swatch{width:30px;height:30px;border-radius:50%;border:3px solid transparent}.swatch.selected{outline:2px solid #fff;outline-offset:2px}.actions{display:flex;gap:8px;margin-top:24px}.actions button{flex:1;border:0;border-radius:10px;padding:12px;color:white;background:#303c4b}.actions .primary{background:#377fe4}.actions .danger{background:#5b2630}.settings{position:absolute;right:0;top:44px;width:185px;display:flex;flex-direction:column;gap:0;background:#171f2a;border:1px solid #303b49;border-radius:12px;padding:5px;box-shadow:0 12px 35px #0009;z-index:15}.settings button{background:transparent;border:0;border-radius:8px;padding:13px 11px;text-align:left;color:#e1e8f1;font-size:13px}.settings button:active{background:#293649}.hint{font-size:12px;color:#8592a4;margin-top:12px;line-height:1.6}input[type=file]{display:none}@media(max-width:370px){.app{padding-left:10px;padding-right:10px}.habitgrid{grid-template-columns:minmax(103px,1.65fr) repeat(7,minmax(27px,1fr))}.habitlabel{font-size:11px}.gridhead{font-size:10px}.tabs{gap:55px}}

<body><main class="app"><header><h1 id="pageTitle">Hábitos</h1><div class="topright"><button id="settingsBtn" class="iconbtn" aria-label="Opções" aria-expanded="false" title="Opções">⋯</button><div class="settings" id="backupArea" hidden><button id="pastEditBtn" aria-pressed="true">Bloquear dias anteriores</button><button id="exportBtn">Exportar dados</button><button id="importBtn">Importar dados</button><input type="file" id="importFile" accept="application/json,.json"></div></div></header>
<section id="tracker" class="section active"><div class="period"><strong id="weekText"></strong><div class="nav"><button id="prevWeek" aria-label="Semana anterior">‹</button><button id="nextWeek" aria-label="Próxima semana">›</button></div></div><div class="gridwrap"><div class="habitgrid" id="habitGrid"></div></div><button class="addbtn" id="addHabit">+ Adicionar hábito</button></section>
<section id="progress" class="section"><div class="segment"><button class="active" data-view="week">Semana</button><button data-view="month">Mês</button></div><div class="period"><strong id="chartPeriod"></strong><div class="nav"><button id="prevChart" aria-label="Período anterior">‹</button><button id="nextChart" aria-label="Próximo período">›</button></div></div><div class="chart" id="chart"></div></section>

</main><nav class="tabs"><button class="active" data-tab="tracker"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Hábitos</button><button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V12M10 20V5M16 20v-9M22 20V3" stroke-linecap="round"/></svg>Progresso</button></nav>
<div class="modalback" id="modalBack"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle">Novo hábito</h2><label for="habitName">Nome</label><input id="habitName" type="text" maxlength="55" placeholder="Ex.: Estudar Medicina"><label>Cor</label><div class="palette" id="palette"></div><div class="actions"><button id="deleteHabit" class="danger" hidden>Excluir</button><button id="cancelModal">Cancelar</button><button id="saveHabit" class="primary">Salvar</button></div></div></div>
<script>
(()=>{'use strict';const KEY='habit_app_v1';const COLORS=['#55aaff','#fa5a66','#ff993c','#986cf5','#ffd15c','#59c987','#3dc3c2','#aa7cf5','#f06caf','#54d2ac'];let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.habits)||typeof data.done!=='object'||!data.done||Array.isArray(data.done))data={habits:[],done:{}};const $=id=>document.getElementById(id);const dateKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const validDateKey=k=>{const d=new Date(k+'T12:00:00');return !Number.isNaN(d.getTime())&&dateKey(d)===k};const dayStart=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());const today=()=>dayStart(new Date());const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);const startWeek=d=>addDays(dayStart(d),-((d.getDay()+6)%7));const fmt=d=>d.toLocaleDateString('pt-BR',{day:'numeric',month:'short'});const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('Não foi possível salvar. Verifique o espaço disponível no navegador.')}};let allowPastEdits=true;let week=startWeek(today()),chartWeek=startWeek(today()),chartMonth=new Date(today().getFullYear(),today().getMonth(),1),view='week',editing=null,selectedColor=COLORS[0];function renderGrid(){const end=addDays(week,6);$('weekText').textContent=cap(fmt(week))+' — '+fmt(end)+' '+end.getFullYear();$('nextWeek').disabled=addDays(week,7)>today();const grid=$('habitGrid');grid.replaceChildren();const head=(text,bold)=>{const el=document.createElement('div');el.className='gridhead';if(bold){const b=document.createElement('b');b.textContent=bold;el.textContent=text;el.append(b)}else el.textContent=text;grid.append(el)};head('HÁBITO');const days=['SEG','TER','QUA','QUI','SEX','SÁB','DOM'];for(let i=0;i<7;i++){const d=addDays(week,i);head(days[i],d.getDate())}for(const h of data.habits){const lab=document.createElement('div');lab.className='habitlabel';lab.textContent=h.name;lab.style.color=h.color;lab.tabIndex=0;lab.setAttribute('role','button');lab.title='Editar hábito';lab.onclick=()=>openModal(h.id);lab.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openModal(h.id)}};grid.append(lab);for(let i=0;i<7;i++){const d=addDays(week,i),key=dateKey(d),done=!!data.done[key]?.includes(h.id);const cell=document.createElement('button');cell.className='cell'+(done?' done':'')+(d>today()?' future':'')+(d<today()&&!allowPastEdits?' locked':'');cell.style.setProperty('--habit',h.color);cell.disabled=d>today()||(d<today()&&!allowPastEdits);cell.setAttribute('aria-label',`${h.name}, ${d.toLocaleDateString('pt-BR')}: ${done?'concluído':'não concluído'}`);cell.onclick=()=>{if(!data.done[key])data.done[key]=[];data.done[key]=done?data.done[key].filter(x=>x!==h.id):[...data.done[key],h.id];if(!data.done[key].length)delete data.done[key];save();renderGrid()};grid.append(cell)}}if(!data.habits.length){const p=document.createElement('div');p.className='empty';p.style.gridColumn='1/-1';p.textContent='Nenhum hábito';grid.append(p)}}function rate(d){if(d>today())return null;const k=dateKey(d),eligible=data.habits.filter(h=>h.created<=k||(data.done[k]||[]).includes(h.id));if(!eligible.length)return null;const ids=new Set(data.done[k]||[]);return Math.round(100*eligible.filter(h=>ids.has(h.id)).length/eligible.length)}function renderChart(){const monthly=view==='month',start=monthly?chartMonth:chartWeek;const dates=monthly?Array.from({length:new Date(start.getFullYear(),start.getMonth()+1,0).getDate()},(_,i)=>addDays(start,i)):Array.from({length:7},(_,i)=>addDays(start,i));$('chartPeriod').textContent=monthly?cap(start.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})):cap(fmt(start))+' — '+fmt(addDays(start,6));$('nextChart').disabled=monthly?new Date(start.getFullYear(),start.getMonth()+1,1)>today():addDays(start,7)>today();const chart=$('chart');chart.className='chart'+(monthly?' monthchart':'');chart.replaceChildren();const rates=dates.map(rate);dates.forEach((d,i)=>{const col=document.createElement('div');col.className='barcol';const val=document.createElement('div');val.className='barval';val.textContent=rates[i]===null?'':rates[i]+'%';const track=document.createElement('div');track.className='track';const fill=document.createElement('div');fill.className='fill';fill.style.height=(rates[i]??0)+'%';track.append(fill);const label=document.createElement('div');label.className='barlabel';label.textContent=monthly?(d.getDate()%5===0||d.getDate()===1?d.getDate():''):['SEG','TER','QUA','QUI','SEX','SÁB','DOM'][i];track.title=d.toLocaleDateString('pt-BR')+': '+(rates[i]===null?'sem dados':rates[i]+'%');col.append(val,track,label);chart.append(col)})}function render(){renderGrid();renderChart()}$('prevWeek').onclick=()=>{week=addDays(week,-7);renderGrid()};$('nextWeek').onclick=()=>{if(addDays(week,7)<=today()){week=addDays(week,7);renderGrid()}};$('prevChart').onclick=()=>{if(view==='week')chartWeek=addDays(chartWeek,-7);else chartMonth=new Date(chartMonth.getFullYear(),chartMonth.getMonth()-1,1);renderChart()};$('nextChart').onclick=()=>{if(view==='week'){if(addDays(chartWeek,7)<=today())chartWeek=addDays(chartWeek,7)}else{const next=new Date(chartMonth.getFullYear(),chartMonth.getMonth()+1,1);if(next<=today())chartMonth=next}renderChart()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab));$('pageTitle').textContent=b.dataset.tab==='tracker'?'Hábitos':'Progresso';$('settingsBtn').hidden=b.dataset.tab!=='tracker';$('backupArea').hidden=true;$('settingsBtn').setAttribute('aria-expanded','false');render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));renderChart()});function openModal(id=null){editing=id;const h=data.habits.find(x=>x.id===id);$('modalTitle').textContent=h?'Editar hábito':'Novo hábito';$('habitName').value=h?.name||'';selectedColor=h?.color||COLORS[data.habits.length%COLORS.length];$('deleteHabit').hidden=!h;renderPalette();$('modalBack').classList.add('open');$('habitName').focus()}function renderPalette(){const pal=$('palette');pal.replaceChildren();for(const c of COLORS){const b=document.createElement('button');b.className='swatch'+(c===selectedColor?' selected':'');b.style.background=c;b.setAttribute('aria-label','Selecionar cor '+c);b.onclick=()=>{selectedColor=c;renderPalette()};pal.append(b)}}function closeModal(){$('modalBack').classList.remove('open')}$('addHabit').onclick=()=>openModal();$('cancelModal').onclick=closeModal;$('modalBack').onclick=e=>{if(e.target===$('modalBack'))closeModal()};$('saveHabit').onclick=()=>{const name=$('habitName').value.trim();if(!name){alert('Digite um nome para o hábito.');return}if(editing){const h=data.habits.find(x=>x.id===editing);if(h){h.name=name;h.color=selectedColor}}else{data.habits.push({id:'h'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),name,color:selectedColor,created:dateKey(today())})}save();closeModal();render()};$('deleteHabit').onclick=()=>{if(!editing||!confirm('Excluir este hábito e seus registros?'))return;data.habits=data.habits.filter(h=>h.id!==editing);for(const k of Object.keys(data.done)){data.done[k]=data.done[k].filter(x=>x!==editing);if(!data.done[k].length)delete data.done[k]}save();closeModal();render()};$('pastEditBtn').onclick=()=>{allowPastEdits=!allowPastEdits;$('pastEditBtn').textContent=allowPastEdits?'Bloquear dias anteriores':'Editar dias anteriores';$('pastEditBtn').setAttribute('aria-pressed',String(allowPastEdits));$('backupArea').hidden=true;$('settingsBtn').setAttribute('aria-expanded','false');renderGrid()};$('settingsBtn').onclick=()=>{const menu=$('backupArea');menu.hidden=!menu.hidden;$('settingsBtn').setAttribute('aria-expanded',String(!menu.hidden))};document.addEventListener('click',e=>{if(!e.target.closest('.topright')){$('backupArea').hidden=true;$('settingsBtn').setAttribute('aria-expanded','false')}});$('exportBtn').onclick=()=>{$('backupArea').hidden=true;$('settingsBtn').setAttribute('aria-expanded','false');const content=JSON.stringify({app:'Habit',version:1,exportedAt:new Date().toISOString(),habits:data.habits,done:data.done},null,2);const blob=new Blob([content],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='habit-backup-'+dateKey(today())+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('importBtn').onclick=()=>{$('backupArea').hidden=true;$('settingsBtn').setAttribute('aria-expanded','false');$('importFile').click()};$('importFile').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>5e6)throw Error('Arquivo muito grande.');const obj=JSON.parse(await file.text());if(!Array.isArray(obj.habits)||!obj.done||typeof obj.done!=='object'||Array.isArray(obj.done))throw Error('Formato inválido.');if(obj.habits.length>200||Object.keys(obj.done).length>10000)throw Error('Backup excede o limite.');const ids=new Set();const habits=obj.habits.map(h=>{if(typeof h.id!=='string'||typeof h.name!=='string'||typeof h.color!=='string'||!/^#[0-9a-fA-F]{6}$/.test(h.color)||h.name.length>55||ids.has(h.id)||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(h.created||'')||!validDateKey(h.created)||h.created>dateKey(today()))throw Error('Hábito inválido.');ids.add(h.id);return{id:h.id,name:h.name,color:h.color,created:h.created}});const done={};for(const [k,v] of Object.entries(obj.done)){if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!Array.isArray(v)||!validDateKey(k)||k>dateKey(today()))throw Error('Registros inválidos.');done[k]=[...new Set(v.filter(id=>ids.has(id)))]}if(!confirm('Importar backup? Isso substituirá todos os hábitos e registros atuais.'))return;data={habits,done};save();week=startWeek(today());chartWeek=week;chartMonth=new Date(today().getFullYear(),today().getMonth(),1);render();alert('Backup importado com sucesso.')}catch(err){alert('Não foi possível importar: '+err.message)}finally{e.target.value=''}};render();})();
</script></body></html>
