<style>
:root{color-scheme:dark;font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#050505;color:#eff3fc;--muted:#9aabc2;--line:#1b2434;--blue:#60a5fa}*{box-sizing:border-box}body{margin:0;min-height:100svh;text-transform:lowercase}button,input,select{font:inherit;text-transform:lowercase}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button,input,select{border:1px solid var(--line);border-radius:16px}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:4px}button{color:inherit;background:#101725;min-height:46px;padding:10px 18px}button:active{transform:scale(.97)}button,input{transition:background .2s,transform .2s,border-color .2s}input,select{background:#0b0f16;color:#eff3fc;padding:14px;width:100%;min-width:0;font-size:16px}input::placeholder{color:#8290a5}label{display:block;font-size:14px;color:var(--muted);margin-bottom:8px}main{max-width:840px;margin:auto;padding:calc(34px + env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left))}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:34px}h1{font-size:24px;letter-spacing:-1px;font-weight:600;margin:0}#today{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}nav{display:flex;padding:5px;background:#0c1018;border:1px solid var(--line);border-radius:20px;width:100%;margin-bottom:34px;gap:5px}nav button{flex:1;background:transparent;border-color:transparent;color:var(--muted);min-height:44px}nav button[aria-selected=true]{background:#19263d;color:#dceaff;box-shadow:0 2px 8px #0004}h2{font-size:17px;font-weight:500;margin:0 0 22px;letter-spacing:-.3px}.panel{border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#10172299,#0a0d1288);padding:22px;margin-top:28px}.muted{color:var(--muted);font-size:14px;line-height:1.6}.grid-wrap{overflow:auto;scrollbar-width:thin;scrollbar-color:#253652 transparent;margin-right:-8px;padding-bottom:12px;overscroll-behavior-x:contain}.grid{display:grid;width:max-content;min-width:100%;align-items:center;gap:8px 4px}.habit-name{position:sticky;left:0;z-index:2;background:#050505;width:126px;min-height:52px;padding:12px 14px 12px 0;display:flex;flex-direction:column;justify-content:center;font-size:15px;overflow-wrap:anywhere}.habit-name small{font-size:12px;color:var(--muted);margin-top:5px}.day{width:44px;text-align:center;color:var(--muted);font-size:12px;line-height:1.6;padding-bottom:8px}.day.current{color:#93c5fd}.cell{width:44px;height:48px;padding:6px;border:0;border-radius:14px;background:none;position:relative}.square{display:block;width:32px;height:34px;border:1px solid #23314a;border-radius:10px;background:#0e1522;overflow:hidden;position:relative}.cell.current .square{border-color:#40608d}.fill{position:absolute;inset:auto 0 0;background:linear-gradient(0deg,#1e3a8a,#3b82f6);height:var(--fill,0%);transition:height .25s ease,opacity .25s}.cell.complete .fill{background:linear-gradient(140deg,#2563eb,#60a5fa)}.cell:disabled{cursor:default}.cell.future{opacity:.35}.cell:active:not(:disabled) .square{transform:scale(.9)}.habit-form{display:grid;grid-template-columns:minmax(0,1fr) 76px;gap:16px 12px}.primary{background:#1e3a8a;border-color:#294eaf;color:#edf5ff}.habit-form button{grid-column:1/-1}.amount-label{color:var(--muted);font-size:14px;margin-bottom:8px}.amount{font-size:clamp(36px,9vw,58px);font-weight:500;letter-spacing:-2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.month-label{margin-top:8px;color:var(--muted);font-size:14px}.expense-form{display:grid;gap:16px}.expense-form button{margin-top:2px}.expenses{list-style:none;padding:0;margin:16px 0 0}.expense{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid #182030}.expense-info{flex:1;min-width:0;overflow-wrap:anywhere}.expense-info small{display:block;color:var(--muted);margin-top:5px;font-size:12px}.expense-value{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:15px}.remove{padding:0;min-width:44px;min-height:44px;background:transparent;border:0;color:var(--muted)}details{margin-top:30px}summary{cursor:pointer;color:var(--muted);font-size:14px;padding:12px 0}#archive-month{margin-top:12px}#archive-total{margin-top:16px;font-size:22px}#notice{color:#b4cfff;font-size:14px;line-height:1.5;margin-top:18px}#notice:empty{display:none}[hidden]{display:none!important}@media(min-width:650px){main{padding-top:64px}header{margin-bottom:44px}nav{width:280px}.panel{padding:26px}.expense-form{grid-template-columns:1fr 160px;align-items:end}.expense-form button{grid-column:1/-1}.habit-name{width:170px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
.habit-tools{display:flex;justify-content:flex-end;margin:-16px 0 18px}.add-toggle{width:44px;height:44px;padding:0;font-size:26px;line-height:1;border-radius:15px;color:#93c5fd}.habit-heading{display:flex;align-items:center;gap:2px}.habit-heading>span{flex:1;min-width:0}.trash{flex-shrink:0;display:grid;place-items:center;width:36px;min-height:44px;padding:0;border:0;background:none;color:#8290a5}.trash svg{width:17px;height:17px}.trash:hover{color:#f0a5a5}dialog{color:#eff3fc;background:#101725;border:1px solid #29364d;border-radius:24px;padding:24px;width:calc(100% - 44px);max-width:380px}dialog::backdrop{background:#000a;backdrop-filter:blur(5px)}dialog h2{margin-bottom:12px}dialog p{color:var(--muted);font-size:15px;line-height:1.6;overflow-wrap:anywhere}.dialog-actions{display:flex;gap:10px;margin-top:24px}.dialog-actions button{flex:1}.danger{background:#49232b;border-color:#69313e;color:#ffd5da}
</style>
</head>
<body><main>
<header><h1>arthur dauer</h1><span id="today"></span></header>
<nav role="tablist" aria-label="seções"><button id="tab-habits" role="tab" aria-selected="true" aria-controls="habits">hábitos</button><button id="tab-expenses" role="tab" aria-selected="false" aria-controls="expenses" tabindex="-1">gastos</button></nav>
<section id="habits" role="tabpanel" aria-labelledby="tab-habits">
<div class="habit-tools"><button id="add-toggle" class="add-toggle" type="button" aria-label="adicionar hábito" aria-expanded="false" aria-controls="add-panel">+</button></div>
<div class="grid-wrap" id="grid-wrap" tabindex="0" aria-label="histórico de hábitos desde 17 de setembro de 2026"><div class="grid" id="grid"></div></div>
<div class="panel" id="add-panel" hidden><h2>adicionar hábito</h2><form id="habit-form" class="habit-form" novalidate><div><label for="habit-name">nome do hábito</label><input id="habit-name" placeholder="nome do hábito" maxlength="60" autocomplete="off" autocapitalize="none" required></div><div><label for="habit-times">vezes</label><input id="habit-times" type="number" inputmode="numeric" min="1" max="999" step="1" value="1" required></div><button class="primary" type="submit">adicionar hábito</button></form></div>
</section>
<section id="expenses" role="tabpanel" aria-labelledby="tab-expenses" hidden>
<div class="amount-label">total do mês atual</div><div id="total" class="amount">r$ 0,00</div><div id="month-label" class="month-label"></div>
<div class="panel"><form id="expense-form" class="expense-form" novalidate><div><label for="expense-name">nome do gasto</label><input id="expense-name" placeholder="café, uber…" maxlength="80" autocomplete="off" autocapitalize="none" required></div><div><label for="expense-value">valor</label><input id="expense-value" inputmode="numeric" placeholder="r$ 0,00" autocomplete="off" required></div><button class="primary" type="submit">adicionar</button></form></div>
<ul id="expense-list" class="expenses"></ul><p id="empty" class="muted">nenhum gasto neste mês.</p>
<details id="history" hidden><summary>meses anteriores</summary><select id="archive-month" aria-label="mês do histórico"></select><div id="archive-total"></div><ul id="archive-list" class="expenses"></ul></details>
</section><p id="notice" role="status" aria-live="polite"></p>
</main>
<dialog id="delete-dialog" aria-labelledby="delete-title" aria-describedby="delete-description"><h2 id="delete-title">apagar hábito?</h2><p id="delete-description"></p><div class="dialog-actions"><button id="delete-cancel" type="button" autofocus>cancelar</button><button id="delete-confirm" class="danger" type="button">apagar</button></div></dialog>
<script>
'use strict';
const KEY='arthur-dauer-v1',START='2026-09-17';
const $=id=>document.getElementById(id),lower=s=>s.toLocaleLowerCase('pt-BR');
function dayKey(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function dateFrom(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d,12)}
function money(cents){return 'r$ '+(cents/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function monthName(k){return lower(dateFrom(k+'-01').toLocaleDateString('pt-BR',{month:'long',year:'numeric'}))}
function node(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el}
function message(text){$('notice').textContent=text}
let state={version:1,habits:[],expenses:[]},storageReady=true,currentDay=dayKey();
function valid(s){return s&&s.version===1&&Array.isArray(s.habits)&&Array.isArray(s.expenses)&&s.habits.every(h=>h&&typeof h.id==='string'&&typeof h.name==='string'&&Number.isInteger(h.times)&&h.times>0&&h.times<=999&&h.counts&&typeof h.counts==='object'&&Object.values(h.counts).every(v=>Number.isInteger(v)&&v>=0&&v<=h.times))&&s.expenses.every(e=>e&&typeof e.id==='string'&&typeof e.name==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(e.day)&&Number.isSafeInteger(e.cents)&&e.cents>0)}
function read(){try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(!valid(parsed))throw Error('invalid');state=parsed}storageReady=true}catch{storageReady=false;message('não foi possível ler seus dados. os registros existentes foram preservados; verifique o armazenamento do navegador.')}}
function commit(next){if(!storageReady){message('o armazenamento está indisponível. seus dados não foram alterados.');return false}try{localStorage.setItem(KEY,JSON.stringify(next));state=next;message('');return true}catch{message('não foi possível salvar. libere espaço no navegador e tente novamente.');return false}}
function clone(){return JSON.parse(JSON.stringify(state))}
function id(){return crypto.randomUUID()}
function days(){const result=[],end=dateFrom(dayKey());end.setDate(end.getDate()+6);for(let d=dateFrom(START);d<=end;d.setDate(d.getDate()+1))result.push(dayKey(d));return result}
function zero(day){return day>=START&&day<=dayKey()&&!state.expenses.some(e=>e.day===day)}
function cellLabel(h,day,count){return `${h.name}, ${day.slice(8)}/${day.slice(5,7)}, ${count} de ${h.times}`}
function paintCell(b,h,day,count){b.style.setProperty('--fill',`${count/h.times*100}%`);b.classList.toggle('complete',count===h.times);b.setAttribute('aria-label',cellLabel(h,day,count)+(h.id==='zero'?', automático':count===h.times?', toque para zerar':''));b.title=b.getAttribute('aria-label')}
function renderGrid(scrollToday=false){const wrap=$('grid-wrap'),previous=wrap.scrollLeft,grid=$('grid');grid.replaceChildren();const dates=days(),today=dayKey();grid.style.gridTemplateColumns=`${matchMedia('(min-width:650px)').matches?170:126}px repeat(${dates.length},44px)`;grid.append(node('div','habit-name'));for(const day of dates){const head=node('div','day'+(day===today?' current':''),`${day.slice(8)}/${day.slice(5,7)}`);if(day===today)head.setAttribute('aria-label','hoje');grid.append(head)}const all=[{id:'zero',name:'gasto zero',times:1,counts:{}},...state.habits];for(const h of all){const name=node('div','habit-name'),heading=node('div','habit-heading');heading.append(node('span','',h.name));if(h.id!=='zero'){const remove=node('button','trash');remove.type='button';remove.setAttribute('aria-label',`apagar hábito ${h.name}`);remove.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7M14 10v7"/></svg>';remove.addEventListener('click',()=>requestDelete(h,remove));heading.append(remove)}name.append(heading);name.append(node('small','',h.id==='zero'?'automático':h.times===1?'1 vez ao dia':`${h.times} vezes ao dia`));grid.append(name);for(const day of dates){const automatic=h.id==='zero',count=automatic?Number(zero(day)):(h.counts[day]||0);const b=node('button','cell'+(day===today?' current':'')+(day>today?' future':''));b.type='button';b.disabled=automatic||day>today;const square=node('span','square');square.append(node('span','fill'));b.append(square);paintCell(b,h,day,count);if(!b.disabled)b.addEventListener('click',()=>{refreshDay();if(day>dayKey())return;const next=clone(),habit=next.habits.find(x=>x.id===h.id);const n=((habit.counts[day]||0)+1)%(habit.times+1);habit.counts[day]=n;if(commit(next)){paintCell(b,habit,day,n);navigator.vibrate?.(8)}});grid.append(b)}}wrap.scrollLeft=scrollToday?Math.max(0,dates.indexOf(today)*48-48):previous}
function expenseList(target,items,editable){target.replaceChildren();for(const e of [...items].sort((a,b)=>b.day.localeCompare(a.day)||(b.created||0)-(a.created||0))){const row=node('li','expense'),info=node('div','expense-info',e.name);info.append(node('small','',`${e.day.slice(8)}/${e.day.slice(5,7)}`));row.append(info,node('span','expense-value',money(e.cents)));if(editable){const remove=node('button','remove','×');remove.type='button';remove.setAttribute('aria-label',`excluir ${e.name}`);remove.addEventListener('click',()=>{const next=clone();next.expenses=next.expenses.filter(x=>x.id!==e.id);if(commit(next)){renderExpenses();renderGrid()}});row.append(remove)}target.append(row)}}
function renderArchive(){const month=$('archive-month').value,items=state.expenses.filter(e=>e.day.startsWith(month));$('archive-total').textContent=money(items.reduce((n,e)=>n+e.cents,0));expenseList($('archive-list'),items,false)}
function renderExpenses(){const month=dayKey().slice(0,7),items=state.expenses.filter(e=>e.day.startsWith(month));$('total').textContent=money(items.reduce((n,e)=>n+e.cents,0));$('month-label').textContent=monthName(month);$('empty').hidden=items.length>0;expenseList($('expense-list'),items,true);const months=[...new Set(state.expenses.map(e=>e.day.slice(0,7)))].filter(m=>m<month).sort().reverse(),select=$('archive-month'),previous=select.value;select.replaceChildren();for(const m of months){const option=node('option','',monthName(m));option.value=m;select.append(option)}if(months.includes(previous))select.value=previous;$('history').hidden=!months.length;if(months.length)renderArchive()}
function refreshDay(){const now=dayKey();if(now!==currentDay){currentDay=now;renderGrid(true);renderExpenses();renderDate()}}
function renderDate(){$('today').textContent=lower(new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})).replace(' de ',' ')}
function toggleAdd(open){$('add-panel').hidden=!open;$('add-toggle').setAttribute('aria-expanded',String(open));$('add-toggle').setAttribute('aria-label',open?'fechar formulário':'adicionar hábito');$('add-toggle').textContent=open?'×':'+';if(open)$('habit-name').focus();else $('add-toggle').focus()}
let pendingDelete=null,deleteTrigger=null;
function requestDelete(h,trigger){pendingDelete=h.id;deleteTrigger=trigger;$('delete-description').textContent=`apagar “${h.name}” e todo o seu histórico? essa ação não pode ser desfeita.`;$('delete-dialog').showModal()}
$('add-toggle').addEventListener('click',()=>toggleAdd($('add-panel').hidden));
$('habit-form').addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();toggleAdd(false)}});
$('delete-cancel').addEventListener('click',()=>$('delete-dialog').close());
$('delete-dialog').addEventListener('close',()=>{pendingDelete=null;if(deleteTrigger?.isConnected)deleteTrigger.focus();else $('add-toggle').focus();deleteTrigger=null});
$('delete-confirm').addEventListener('click',()=>{if(!pendingDelete||pendingDelete==='zero')return;const next=clone();next.habits=next.habits.filter(h=>h.id!==pendingDelete);if(commit(next)){renderGrid();$('delete-dialog').close();message('hábito apagado.')}else{$('delete-dialog').close()}});
function tab(name){for(const key of ['habits','expenses']){const active=key===name;$('tab-'+key).setAttribute('aria-selected',String(active));$('tab-'+key).tabIndex=active?0:-1;$(key).hidden=!active}refreshDay()}
for(const name of ['habits','expenses']){$('tab-'+name).addEventListener('click',()=>tab(name));$('tab-'+name).addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const next=e.key==='Home'?'habits':e.key==='End'?'expenses':name==='habits'?'expenses':'habits';tab(next);$('tab-'+next).focus()}})}
$('habit-form').addEventListener('submit',e=>{e.preventDefault();refreshDay();const name=lower($('habit-name').value.trim()),times=Number($('habit-times').value);if(!name||!Number.isInteger(times)||times<1||times>999){message('informe um nome e uma quantidade inteira entre 1 e 999.');return}if(name==='gasto zero'){message('gasto zero já é acompanhado automaticamente.');return}const next=clone();next.habits.push({id:id(),name,times,counts:{}});if(commit(next)){$('habit-form').reset();renderGrid();toggleAdd(false)}});
let cents=0;$('expense-value').addEventListener('input',e=>{const digits=e.target.value.replace(/\D/g,'').slice(0,11);cents=Number(digits)||0;e.target.value=digits?money(cents):''});
$('expense-form').addEventListener('submit',e=>{e.preventDefault();refreshDay();const name=lower($('expense-name').value.trim());if(!name||!Number.isSafeInteger(cents)||cents<=0){message('informe o nome e um valor maior que zero.');return}const next=clone();if(!Number.isSafeInteger(next.expenses.reduce((sum,x)=>sum+x.cents,0)+cents)){message('este valor ultrapassa o limite de armazenamento numérico.');return}next.expenses.push({id:id(),name,cents,day:dayKey(),created:Date.now()});if(commit(next)){$('expense-form').reset();cents=0;renderExpenses();renderGrid();$('expense-name').focus()}});
$('archive-month').addEventListener('change',renderArchive);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshDay()});window.addEventListener('focus',refreshDay);setInterval(refreshDay,15000);window.addEventListener('storage',e=>{if(e.key===KEY){read();renderGrid();renderExpenses()}});window.addEventListener('resize',()=>renderGrid());read();renderDate();renderGrid(true);renderExpenses();
// Safari home-screen metadata and icon remain embedded to keep this a single file.
const canvas=document.createElement('canvas');canvas.width=canvas.height=180;const ctx=canvas.getContext('2d');ctx.fillStyle='#050505';ctx.fillRect(0,0,180,180);ctx.fillStyle='#2563eb';ctx.beginPath();ctx.roundRect(45,45,90,90,26);ctx.fill();const icon=canvas.toDataURL('image/png'),apple=document.createElement('link');apple.rel='apple-touch-icon';apple.href=icon;document.head.append(apple);const manifest={name:'arthur dauer',short_name:'arthur dauer',start_url:location.href.split('#')[0],display:'standalone',background_color:'#050505',theme_color:'#050505',icons:[{src:icon,sizes:'180x180',type:'image/png'}]};const link=document.createElement('link');link.rel='manifest';link.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(manifest));document.head.append(link);
</script></body></html>
